name: Daily Episode

on:
  schedule:
    # 9:52 UTC ≈ 6am ET / 3am PT — live by ~6:30-7am ET, in the US East
    # Coast commute window and ahead of the morning news cycle. The odd
    # minute avoids GitHub's congested on-the-hour cron slots, which have
    # been delaying runs by 2-6 hours.
    - cron: "52 9 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: run the full pipeline but skip all uploads/publishing, even if today's episode already exists"
        type: boolean
        default: false
      fresh:
        description: "Regenerate all of today's artifacts instead of reusing cached checkpoints (upload ledger is preserved)"
        type: boolean
        default: false
      special_note:
        description: "Optional one-off announcement or editorial note for the hosts to mention naturally in this episode"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  produce-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's episode already exists
        id: guard
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Test mode — running regardless of published state."
          elif python3 -c "import json,sys; eps=json.load(open('sites/ai-daily/static/articles.json')); sys.exit(0 if any(e['date']=='$TODAY' for e in eps) else 1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Episode for $TODAY already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore checkpoints from an earlier run of today's episode, so a
      # retry after a failure skips the stages (and uploads) that already
      # completed instead of regenerating everything.
      - name: Restore today's checkpoints
        if: steps.guard.outputs.exists == 'false'
        uses: actions/cache/restore@v4
        with:
          path: output/${{ steps.guard.outputs.today }}
          key: episode-output-v2-${{ steps.guard.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            episode-output-v2-${{ steps.guard.outputs.today }}-

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.exists == 'false'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: steps.guard.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'false'
        run: pip install -r requirements.txt

      - name: Produce and distribute episode
        if: steps.guard.outputs.exists == 'false'
        env:
          # Required
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Optional — guests, social, podcast hosting (empty = feature skipped)
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # Fine-grained PAT (Secrets: write on this repo) so rotated
          # Instagram/TikTok tokens persist across runs
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Podcast feed is served from the website
          RSS_FEED_URL: https://contextwindow.distomostech.com/feed.xml
          # Episode settings
          EPISODE_DURATION_MINUTES: "12"
          TIMEZONE: America/Los_Angeles
          EPISODE_SPECIAL_NOTE: ${{ inputs.special_note }}
        run: python main.py ${{ inputs.test_mode == true && '--no-upload' || '' }} ${{ inputs.fresh == true && '--fresh' || '' }}

      - name: Publish article to website
        if: steps.guard.outputs.exists == 'false' && inputs.test_mode != true
        run: |
          python publish_site.py --episode-dir "output/${{ steps.guard.outputs.today }}" --site-dir sites/ai-daily
          # Podcast feed rides along with the site (Spotify/Apple poll it)
          if [ -f output/feed.xml ]; then
            cp output/feed.xml sites/ai-daily/feed.xml
            echo "Copied feed.xml into the site"
          fi

      - name: Validate website links
        if: steps.guard.outputs.exists == 'false' && inputs.test_mode != true
        run: python scripts/check_site_links.py sites/ai-daily

      - name: Push website update
        if: steps.guard.outputs.exists == 'false' && inputs.test_mode != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/ai-daily sites/distomos/app/latest-episode.json
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Add Context Window article for ${{ steps.guard.outputs.today }}"
            git push
          fi

      # Save checkpoints even when the run fails — that's exactly when the
      # next attempt needs them. Keys are immutable, so each attempt saves
      # under a unique suffix and restore picks the newest by prefix.
      - name: Save today's checkpoints
        if: always() && steps.guard.outputs.exists == 'false'
        uses: actions/cache/save@v4
        with:
          path: output/${{ steps.guard.outputs.today }}
          key: episode-output-v2-${{ steps.guard.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}

      # In test mode nothing is posted anywhere, so attach the rendered
      # videos to the run for visual review.
      - name: Upload rendered videos (test mode)
        if: always() && inputs.test_mode == true
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.guard.outputs.today }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/${{ steps.guard.outputs.today }}/episode_landscape.mp4
            output/${{ steps.guard.outputs.today }}/clips/*.mp4

      - name: Upload logs and episode summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.guard.outputs.today }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            media_engine.log
            output/${{ steps.guard.outputs.today }}/*.json
            output/${{ steps.guard.outputs.today }}/transcript.txt
            output/${{ steps.guard.outputs.today }}/*.png
            !output/${{ steps.guard.outputs.today }}/*.mp4
            !output/${{ steps.guard.outputs.today }}/*.mp3
